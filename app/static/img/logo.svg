<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LoopClose">
  <defs>
    <linearGradient id="lc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#lc-bg)"/>
  <!-- open loop arc -->
  <path d="M46 22.5A17 17 0 1 0 49 33" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- arrowhead closing the loop -->
  <path d="M41 20.5l6.5 1.6 1.3-6.6" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- check inside -->
  <path d="M24.5 32.5l5.5 5.5 10-11" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
